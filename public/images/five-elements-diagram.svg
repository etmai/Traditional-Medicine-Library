<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for card -->
    <linearGradient id="parchment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f5efe6" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4a3e3d" flood-opacity="0.1" />
    </filter>
    
    <!-- Arrows markers -->
    <marker id="arrow-sinh" viewBox="0 0 10 10" refX="24" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d5a27" />
    </marker>
    <marker id="arrow-khac" viewBox="0 0 10 10" refX="28" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d9534f" />
    </marker>
  </defs>

  <!-- Parchment Card Background -->
  <rect width="600" height="520" rx="16" fill="url(#parchment)" stroke="#e4dcd0" stroke-width="1.5" />

  <!-- Subtle manuscript gridlines -->
  <g stroke="#eae3d5" stroke-width="0.5" opacity="0.6">
    <line x1="300" y1="0" x2="300" y2="520" />
    <circle cx="300" cy="240" r="160" fill="none" stroke-dasharray="2 2" />
  </g>

  <!-- Title -->
  <text x="300" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#2c1e18" text-anchor="middle" letter-spacing="1.5">
    SƠ ĐỒ TƯƠNG SINH TƯƠNG KHẮC NGŨ HÀNH
  </text>
  <line x1="180" y1="46" x2="420" y2="46" stroke="#bfa37a" stroke-width="1" />

  <!-- ==================== ARROWS / INTERACTIONS ==================== -->
  
  <!-- 1. Tương Sinh (Generating Circle: Wood -> Fire -> Earth -> Metal -> Water -> Wood) -->
  <!-- Coordinates: Mộc(150, 200) -> Hỏa(300, 90) -> Thổ(450, 200) -> Kim(390, 370) -> Thủy(210, 370) -> Mộc(150,200) -->
  <g fill="none" stroke="#2d5a27" stroke-width="3" stroke-linecap="round" opacity="0.75" marker-end="url(#arrow-sinh)">
    <!-- Mộc -> Hỏa -->
    <path d="M 150 200 Q 200 120 300 90" />
    <!-- Hỏa -> Thổ -->
    <path d="M 300 90 Q 400 120 450 200" />
    <!-- Thổ -> Kim -->
    <path d="M 450 200 Q 440 300 390 370" />
    <!-- Kim -> Thủy -->
    <path d="M 390 370 Q 300 395 210 370" />
    <!-- Thủy -> Mộc -->
    <path d="M 210 370 Q 160 300 150 200" />
  </g>

  <!-- 2. Tương Khắc (Controlling Star: Wood -> Earth -> Water -> Fire -> Metal -> Wood) -->
  <g fill="none" stroke="#d9534f" stroke-width="2" stroke-dasharray="5 4" opacity="0.8" marker-end="url(#arrow-khac)">
    <!-- Mộc -> Thổ -->
    <path d="M 150 200 L 450 200" />
    <!-- Thổ -> Thủy -->
    <path d="M 450 200 L 210 370" />
    <!-- Thủy -> Hỏa -->
    <path d="M 210 370 L 300 90" />
    <!-- Hỏa -> Kim -->
    <path d="M 300 90 L 390 370" />
    <!-- Kim -> Mộc -->
    <path d="M 390 370 L 150 200" />
  </g>

  <!-- ==================== ELEMENT NODES ==================== -->

  <!-- Node 1: Hỏa (Fire) - TOP -->
  <g transform="translate(300, 90)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#ff3c00" stroke-width="3" />
    <circle cx="0" cy="0" r="38" fill="#ff3c00" fill-opacity="0.08" />
    <!-- Fire Icon -->
    <path d="M-8 12 C-12 6 -10 -2 -4 -6 C-6 0 -4 4 0 2 C0 -6 6 -12 2 -18 C12 -8 12 4 4 12 C10 8 8 2 6 2 C4 8 0 12 -8 12 Z" fill="#ff3c00" transform="translate(0, -10) scale(0.7)" />
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ff3c00" text-anchor="middle">HỎA</text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#555" text-anchor="middle">Tâm (Tim)</text>
  </g>

  <!-- Node 2: Thổ (Earth) - RIGHT -->
  <g transform="translate(450, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#d4a373" stroke-width="3" />
    <circle cx="0" cy="0" r="38" fill="#d4a373" fill-opacity="0.08" />
    <!-- Earth Icon (Mountains) -->
    <path d="M-15 10 L-5 -5 L5 5 L15 -10 L25 10 Z" fill="#d4a373" transform="translate(-5, -6) scale(0.6)" />
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#b57a3d" text-anchor="middle">THỔ</text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#555" text-anchor="middle">Tỳ (Lá lách)</text>
  </g>

  <!-- Node 3: Kim (Metal) - BOTTOM-RIGHT -->
  <g transform="translate(390, 370)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#7f8c8d" stroke-width="3" />
    <circle cx="0" cy="0" r="38" fill="#7f8c8d" fill-opacity="0.08" />
    <!-- Metal Icon (Shield/Ingot) -->
    <path d="M-10 -10 L10 -10 L15 0 C15 10 0 18 0 18 C0 18 -15 10 -15 0 Z" fill="#7f8c8d" transform="translate(0, -6) scale(0.6)" />
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#57606f" text-anchor="middle">KIM</text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#555" text-anchor="middle">Phế (Phổi)</text>
  </g>

  <!-- Node 4: Thủy (Water) - BOTTOM-LEFT -->
  <g transform="translate(210, 370)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#0052d4" stroke-width="3" />
    <circle cx="0" cy="0" r="38" fill="#0052d4" fill-opacity="0.08" />
    <!-- Water Icon (Droplet) -->
    <path d="M0 -15 C0 -15 10 -3 10 5 C10 11 5 15 0 15 C-5 15 -10 11 -10 5 C-10 -3 0 -15 0 -15 Z" fill="#0052d4" transform="translate(0, -5) scale(0.6)" />
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#0052d4" text-anchor="middle">THỦY</text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#555" text-anchor="middle">Thận (Thận)</text>
  </g>

  <!-- Node 5: Mộc (Wood) - LEFT -->
  <g transform="translate(150, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#2d5a27" stroke-width="3" />
    <circle cx="0" cy="0" r="38" fill="#2d5a27" fill-opacity="0.08" />
    <!-- Wood Icon (Leaves) -->
    <path d="M-10 10 Q-15 0 0 -15 Q15 0 10 10 Q0 5 -10 10 Z" fill="#2d5a27" transform="translate(0, -5) scale(0.6)" />
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#2d5a27" text-anchor="middle">MỘC</text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#555" text-anchor="middle">Can (Gan)</text>
  </g>

  <!-- ==================== LEGEND ==================== -->
  
  <g transform="translate(120, 445)">
    <!-- Legend Box Background -->
    <rect width="360" height="55" rx="8" fill="#ffffff" fill-opacity="0.8" stroke="#e4dcd0" stroke-width="1" />
    
    <!-- Legend Items -->
    <!-- Tương Sinh -->
    <line x1="20" y1="28" x2="60" y2="28" stroke="#2d5a27" stroke-width="3" />
    <polygon points="60,25 67,28 60,31" fill="#2d5a27" />
    <text x="80" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#2d5a27">Tương Sinh (Thúc đẩy)</text>

    <!-- Tương Khắc -->
    <line x1="200" y1="28" x2="240" y2="28" stroke="#d9534f" stroke-width="2" stroke-dasharray="4 3" />
    <polygon points="240,25 247,28 240,31" fill="#d9534f" />
    <text x="260" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#d9534f">Tương Khắc (Chế ước)</text>
  </g>
</svg>
